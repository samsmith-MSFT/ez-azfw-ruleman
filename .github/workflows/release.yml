name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$RELEASE_TAG" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package.json version $version"
            exit 1
          fi
      # Created once up front so the parallel build jobs all upload to the same draft. The
      # release stays a draft (invisible to users) until every build has succeeded.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "EZ AzFW Rule Manager $RELEASE_TAG" --notes "Building…"
          fi

  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-latest
            arch: arm64
          - os: macos-latest
            arch: arm64
          # Built on the Apple silicon runner; Forge downloads the x64 Electron binary.
          - os: macos-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Optional macOS signing: runs only when the certificate secret is configured.
      - name: Import macOS signing certificate
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # Optional Windows signing: runs only when the certificate secret is configured.
      - name: Write Windows signing certificate
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'cert.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          "WINDOWS_CERTIFICATE_FILE=$path" >> $env:GITHUB_ENV

      - run: npm ci

      - name: Build portable executable
        run: npm run dist -- --arch ${{ matrix.arch }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(out/release/*.exe out/release/*.AppImage out/release/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No release files were built"
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Check every platform was uploaded
        run: |
          version="${RELEASE_TAG#v}"
          missing=0
          for file in \
            "ez-azfw-ruleman-$version-win-x64.exe" \
            "ez-azfw-ruleman-$version-win-arm64.exe" \
            "ez-azfw-ruleman-$version-mac-arm64.zip" \
            "ez-azfw-ruleman-$version-mac-x64.zip" \
            "ez-azfw-ruleman-$version-linux-x86_64.AppImage"; do
            if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx "$file"; then
              echo "::error::Missing release file $file"
              missing=1
            fi
          done
          exit $missing

      - name: Add checksums
        run: |
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern '*.exe' --pattern '*.zip' --pattern '*.AppImage'
          (cd dist && sha256sum * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber

      - name: Write release notes
        run: |
          export VERSION="${RELEASE_TAG#v}" TAG="$RELEASE_TAG" REPO="$GITHUB_REPOSITORY"
          # This version's section of CHANGELOG.md, without its heading or link definitions.
          CHANGES="$(awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "${CHANGES//[[:space:]]/}" ]; then
            CHANGES="See [CHANGELOG.md](https://github.com/$REPO/blob/$TAG/CHANGELOG.md)."
          fi
          export CHANGES
          envsubst '${VERSION} ${TAG} ${REPO} ${CHANGES}' \
            < .github/release-notes.md > notes.md
          cat notes.md

      - name: Publish
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "EZ AzFW Rule Manager $RELEASE_TAG" --notes-file notes.md
